<svg width="100%" viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BureauFlow architecture: ETL and agent scripts write to a shared SQLite database, which three separate dashboards read from." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ETL + agent scripts -->
  <rect x="50" y="150" width="200" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="150" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">ETL + agent scripts</text>
  <text x="150" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">writes to the database</text>

  <!-- arrow scripts -> db -->
  <line x1="250" y1="185" x2="308" y2="185" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bureauflow.db -->
  <rect x="310" y="150" width="200" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="410" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">bureauflow.db</text>
  <text x="410" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#712B13">shared SQLite file</text>

  <!-- trunk: db down to bus -->
  <line x1="410" y1="220" x2="410" y2="250" stroke="#5F5E5A" stroke-width="1.5"/>
  <!-- bus line -->
  <line x1="200" y1="250" x2="620" y2="250" stroke="#5F5E5A" stroke-width="1.5"/>
  <!-- drops to reader boxes -->
  <line x1="200" y1="250" x2="200" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="250" x2="410" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="250" x2="620" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- reader boxes (teal, matches the app's live theme color) -->
  <rect x="115" y="280" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="200" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Analytics</text>
  <text x="200" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Phase 2</text>

  <rect x="325" y="280" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="410" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Review console</text>
  <text x="410" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Phase 3</text>

  <rect x="535" y="280" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="620" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Ops monitoring</text>
  <text x="620" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Phase 4</text>
</svg>
